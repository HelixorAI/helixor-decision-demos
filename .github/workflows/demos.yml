# Keep the examples, their pinned outputs and the README's commands honest.
#
# hygiene  runs everywhere and needs no runtime.
# runtime  needs the licensed runtime wheels. They are downloaded at run time
#          from the private release with a read-only token held as a secret,
#          checked against the release's SHA256SUMS, installed outside the
#          checkout, and never uploaded or cached. Where the secrets are not
#          available (a pull request from a fork, or a copy of this
#          repository) the job says it skipped and why; on this repository's
#          own pushes a missing secret is a failure, not a skip.
#
# Secrets (repository settings, never in this file):
#   HELIXOR_RUNTIME_RELEASE_REPO   owner/name of the private release repository
#   HELIXOR_RUNTIME_RELEASE_TOKEN  read-only token for its releases
#   HELIXOR_DEVELOPER_LICENSE      optional: a Developer .hxlic for the Tier 1 step

name: demos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - name: Repository hygiene (no runtime needed)
        run: python -m pytest -q tests/test_repo_hygiene.py
      - name: Shell syntax
        run: bash -n run_all.sh

  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      RUNTIME_TAG: v0.3.0
      RELEASE_REPO: ${{ secrets.HELIXOR_RUNTIME_RELEASE_REPO }}
      GH_TOKEN: ${{ secrets.HELIXOR_RUNTIME_RELEASE_TOKEN }}
      HAS_LICENSE: ${{ secrets.HELIXOR_DEVELOPER_LICENSE != '' }}
    steps:
      - name: Runtime access
        id: access
        run: |
          if [ -n "$RELEASE_REPO" ] && [ -n "$GH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          msg="The licensed runtime wheels are not available to this run (release secrets not set). run_all.sh, check_docs.py and the runtime tests did NOT run; this is not a pass."
          if [ "${{ github.repository }}" = "HelixorAI/helixor-decision-demos" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error title=Runtime secrets missing::$msg"
            exit 1
          fi
          echo "::notice title=Runtime job skipped::$msg"
          echo "### Runtime job skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.access.outputs.available == 'true'
      - uses: actions/setup-python@v5
        if: steps.access.outputs.available == 'true'
        with:
          python-version: ${{ matrix.python }}

      - name: Download and verify the runtime wheels
        if: steps.access.outputs.available == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/wheels"
          gh release download "$RUNTIME_TAG" -R "$RELEASE_REPO" -D "$RUNNER_TEMP/wheels"
          cd "$RUNNER_TEMP/wheels" && sha256sum -c SHA256SUMS

      - name: Install (both wheels in one pip install, as in README step 3)
        if: steps.access.outputs.available == 'true'
        run: |
          python -m pip install "$RUNNER_TEMP"/wheels/helixor_constraint_network-*.whl \
                                "$RUNNER_TEMP"/wheels/helixor_runtime-*.whl
          python -m pip install -e ".[dev]"
          python -c "import helixor_runtime as h; e = h.HelixorEngine(); print(h.__version__, e.pack_id, e.tier)"

      - name: run_all.sh (Community tier)
        if: steps.access.outputs.available == 'true'
        run: env -u HELIXOR_LICENSE_FILE HOME="$RUNNER_TEMP/empty-home" ./run_all.sh -v

      - name: README commands and pinned outputs
        if: steps.access.outputs.available == 'true'
        run: python scripts/check_docs.py

      - name: Tests
        if: steps.access.outputs.available == 'true'
        run: python -m pytest -q

      - name: Tier 1 (Developer license)
        if: steps.access.outputs.available == 'true'
        env:
          LICENSE_BODY: ${{ secrets.HELIXOR_DEVELOPER_LICENSE }}
        run: |
          if [ "$HAS_LICENSE" != "true" ]; then
            echo "::notice title=Tier 1 skipped::No Developer license secret; example 11 and the pack tests did NOT run."
            exit 0
          fi
          lic="$RUNNER_TEMP/helixor.lic"
          umask 077 && printf '%s' "$LICENSE_BODY" > "$lic"
          HELIXOR_LICENSE_FILE="$lic" python examples/11_compiled_pack.py
          helixor-pack compile --playbook playbooks/internal_ids.yaml --license "$lic" \
            --out "$RUNNER_TEMP/internal_ids.hxpack"
          cd policy-tests
          POLICY_PACK="$RUNNER_TEMP/internal_ids.hxpack" POLICY_LICENSE="$lic" python -m pytest -v pack_tests
          rm -f "$lic" "$RUNNER_TEMP/internal_ids.hxpack"
